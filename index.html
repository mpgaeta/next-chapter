<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16385c"><title>Next Chapter</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#19304a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#16385c;color:white;padding:22px 18px 18px}header h1{font-size:27px;margin:0}header p{margin:4px 0 0;color:#d5e3f3;font-size:13px}.shell{max-width:860px;margin:auto;padding-bottom:85px}.stats{display:flex;gap:10px;margin:16px}.stat{flex:1;background:white;border-radius:14px;padding:16px;text-align:center;box-shadow:0 1px 6px #152c4b12}.stat strong{font-size:26px;display:block}.stat span{font-size:12px;color:#62758b}main{padding:0 16px}.toolbar{display:flex;gap:8px;margin:12px 0}input,select,textarea{font:inherit;border:1px solid #d5dfe9;border-radius:10px;padding:12px;width:100%;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#1d527f;color:white}button.secondary{background:#e9f0f7;color:#214769}button.danger{background:#fff0f0;color:#a73535}.book{background:white;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 1px 6px #152c4b10}.book h3{font-size:16px;margin:0 0 5px}.book p{color:#62758b;font-size:13px;margin:0 0 10px}.book .actions{display:flex;gap:7px;flex-wrap:wrap}.book .actions button{font-size:12px}.stars{color:#c38b19;letter-spacing:2px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e0e7ee;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:4}.nav button{flex:1;max-width:180px;border-radius:0;background:white;color:#5d6f83;font-size:12px;padding:13px 2px}.nav button.active{color:#164c7d;background:#eaf2fa;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.heading h2{font-size:21px}.empty{color:#60758a;padding:25px;text-align:center}.overlay{position:fixed;inset:0;background:#102b49aa;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.show{display:flex}.modal{background:white;border-radius:18px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:5px;color:#4b6076}.modalfooter{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.muted{color:#61758b;font-size:13px}.notice{background:#e9f1fa;padding:15px;border-radius:12px;color:#355571;font-size:14px}.author{display:flex;align-items:center;justify-content:space-between;background:white;border-radius:12px;margin:8px 0;padding:14px}.author button{font-size:12px}.author-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{font-size:12px;color:#6d7d8e}a{color:#155d9d}
</style></head><body><div class="shell"><header><h1>📖 Next Chapter</h1><p>Your personal reading companion</p></header><div class="stats"><div class="stat"><strong id="readCount">41</strong><span>Books read</span></div><div class="stat"><strong id="wantCount">36</strong><span>Want to read</span></div><div class="stat"><strong id="authorCount">10</strong><span>Favorite authors</span></div></div><main id="content"></main></div><nav class="nav" id="nav"><button data-tab="read">✓ Read</button><button data-tab="want">▤ To Read</button><button data-tab="authors">♧ Authors</button><button data-tab="discover">✦ Recommendations</button></nav><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const SUPABASE_URL='https://oystkzbajiphgmvzjutb.supabase.co';
const SUPABASE_KEY='sb_publishable_59ROd03RAGiV9vGjIMEjKg_7B9svYHG';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const genres=['','Mystery / Thriller','Fiction','Nonfiction','Biography','Adventure','Sports','Romance','Other'];
const initialAuthors=["CJ Box","David Baldacci","James Patterson","John Grisham","Lee Child","Steven Fry","Walter Isaacson","Harlan Coplan ??","Marcia Clark","Michael Connelly"];
let authors=[];
function authorStorageKey(){return user?'next-chapter-authors-user-'+user.id:null}
function localAuthorCandidates(){
 const key=authorStorageKey();
 let saved=[];
 for(const k of [key,'next-chapter-authors-v2']){
  if(!k)continue;
  try{const value=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(value))saved.push(...value)}catch{}
 }
 return [...new Map(saved.filter(a=>typeof a==='string'&&a.trim()).map(a=>[a.trim().toLowerCase(),a.trim()])).values()];
}
async function loadAuthors(){
 if(!user)return;
 const currentUser=user.id;
 const {data,error}=await db.from('favorite_authors').select('name').eq('user_id',currentUser);
 if(error){console.error('Unable to load favorite authors:',error);authors=[];authorError=error.message;return}
 authorError='';
 authors=(data||[]).map(a=>a.name).filter(Boolean);
 // One-time import from this browser, only if the cloud list is empty.
 const migrationKey='next-chapter-authors-migrated-'+currentUser;
 if(!authors.length&&!localStorage.getItem(migrationKey)){
  const oldAuthors=localAuthorCandidates();
  if(oldAuthors.length){
   const {error:importError}=await db.from('favorite_authors').insert(oldAuthors.map(name=>({name,user_id:currentUser})));
   if(importError){authorError='Could not import existing authors: '+importError.message;return}
   authors=oldAuthors;
  }
 }
 localStorage.setItem(migrationKey,'1');
}
let books=[],tab='read',query='',user=null,busy=false,authorError='';
const norm=s=>String(s||'').toLowerCase()==='read'?'read':'want';
function statusDb(s){return s==='read'?'Read':'To Read'}
function message(t){el('content').innerHTML='<div class="notice">'+esc(t)+'</div>'}
function setBusy(v){busy=v}
async function boot(){
 const {data:{session},error}=await db.auth.getSession();
 if(error){message(error.message);return}
 user=session?.user||null;
 if(!user){loginScreen();return}
 await Promise.all([loadBooks(),loadAuthors()]);
 render();
}
function loginScreen(note=''){
 el('readCount').textContent='—';el('wantCount').textContent='—';el('authorCount').textContent=authors.length;
 el('content').innerHTML=`<div class="book"><h2>Sign in to Next Chapter</h2><p>Your books are private and saved in Supabase.</p>${note?'<div class="notice">'+esc(note)+'</div>':''}<form id="loginForm"><div class="field"><label>Email address<input name="email" type="email" required autocomplete="email"></label></div><div class="field"><label>Password<input name="password" type="password" required autocomplete="current-password"></label></div><button type="submit">Sign in</button> <button type="button" class="secondary" id="signup">Create account</button></form><p><button class="secondary" id="magic">Email me a sign-in link</button></p><p class="small">If you created your account without a password, use the email sign-in link.</p></div>`;
 el('loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);message('Signing in…');let {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)loginScreen(error.message);else boot()};
 el('magic').onclick=async()=>{let email=el('loginForm').elements.email.value.trim();if(!email){alert('Please enter your email address first.');return}let {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});loginScreen(error?error.message:'Check your email for a sign-in link. Open the link in this browser.')};
}
async function loadBooks(){
 message('Loading your books from Supabase…');
 let {data,error}=await db.from('books').select('*').eq('user_id',user.id).order('id',{ascending:true}).range(0,999);
 if(error){message('Unable to load books: '+error.message);return}
 books=(data||[]).map(b=>({...b,status:norm(b.status),rating:Number(b.rating)||0,genre:({'Historical Fiction':'Fiction','Nonfiction / History':'Nonfiction'}[b.genre]||b.genre||''),notes:b.notes||''}));
 render();
}
function setTab(t){tab=t;query='';render()}
function render(){
 if(!user){loginScreen();return}
 el('readCount').textContent=books.filter(b=>b.status==='read').length;
 el('wantCount').textContent=books.filter(b=>b.status==='want').length;
 el('authorCount').textContent=authors.length;
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 let content=el('content');
 if(tab==='read'||tab==='want'){
 content.innerHTML=`<div class="heading"><h2>${tab==='read'?'Books Read':'To Read'}</h2><button onclick="editBook()">+ Add book</button></div><div class="toolbar"><input aria-label="Search books" placeholder="Search title, author or genre" value="${esc(query)}" oninput="query=this.value;renderList()"></div><div id="bookList"></div><p class="small"><button class="secondary" onclick="signOut()">Sign out</button></p>`;
 renderList();
 }else if(tab==='authors'){
 content.innerHTML=`<div class="heading"><h2>Favorite Authors</h2><button onclick="addAuthor()">+ Add author</button></div><p class="small">Favorite authors are saved securely to your account and sync between devices.${authorError?' <strong>Sync error: '+esc(authorError)+'</strong>':''}</p>${authors.map(a=>`<div class="author"><div><b>${esc(a)}</b><div class="small">${books.filter(b=>b.author.toLowerCase()===a.toLowerCase()).length} books in library</div></div><div class="author-actions"><button class="secondary" onclick='searchAuthor(${JSON.stringify(a)})'>Find books</button><button class="danger" onclick='deleteAuthor(${JSON.stringify(a)})'>Delete</button></div></div>`).join('')}<button class="secondary" onclick="signOut()">Sign out</button>`;
 }else{
 let ranked=books.filter(b=>b.status==='read'&&b.rating>=4).sort((a,b)=>b.rating-a.rating);
 content.innerHTML=`<div class="heading"><h2>Recommended Books</h2></div><div class="notice"><b>Recommendation starter</b><p>Browse favorite authors and highly rated books. Automatic release alerts are not available yet.</p></div><h3>Your highest-rated books</h3>${ranked.length?ranked.slice(0,6).map(b=>`<div class="book"><h3>${esc(b.title)}</h3><p>${esc(b.author)} · <span class="stars">${'★'.repeat(b.rating)}</span></p></div>`).join(''):'<p class="muted">Rate some books 4 or 5 stars to guide future recommendations.</p>'}<h3>Explore favorite authors</h3>${authors.map(a=>`<div class="author"><b>${esc(a)}</b><button onclick='searchAuthor(${JSON.stringify(a)})'>Search Open Library ↗</button></div>`).join('')}<p class="muted">New titles must be added manually.</p><div class="toolbar"><button class="secondary" onclick="downloadBackup()">Download my data backup</button><button class="secondary" onclick="signOut()">Sign out</button></div>`;
 }
}
function renderList(){
 let list=el('bookList');if(!list)return;
 let matches=books.filter(b=>b.status===tab&&[b.title,b.author,b.genre].some(v=>String(v||'').toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.title.localeCompare(b.title));
 list.innerHTML=matches.map(b=>`<article class="book"><h3>${esc(b.title)}</h3><p>${esc(b.author)}${b.genre?' · '+esc(b.genre):''}${b.rating?' · <span class="stars">'+'★'.repeat(Math.min(5,b.rating))+'</span>':''}</p><div class="actions"><button class="secondary" onclick="editBook(${Number(b.id)})">Edit details</button><button onclick="moveBook(${Number(b.id)})">${b.status==='read'?'Move to To Read':'Mark as read'}</button></div></article>`).join('')||'<div class="empty">No books found.</div>';
}
function closeModal(){el('overlay').classList.remove('show')}
el('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
function editBook(id){
 let b=books.find(x=>x.id===id)||{title:'',author:'',status:tab==='want'?'want':'read',rating:0,genre:'',notes:''};
 el('modal').innerHTML=`<h2>${id?'Edit book':'Add a book'}</h2><form id="bookForm"><div class="field"><label>Title<input name="title" required value="${esc(b.title)}"></label></div><div class="field"><label>Author<input name="author" required value="${esc(b.author)}"></label></div><div class="field"><label>Reading status<select name="status"><option value="read" ${b.status==='read'?'selected':''}>Read</option><option value="want" ${b.status==='want'?'selected':''}>To Read</option></select></label></div><div class="field"><label>Genre<select name="genre">${genres.map(g=>`<option value="${esc(g)}" ${b.genre===g?'selected':''}>${esc(g||'Select genre')}</option>`).join('')}</select></label></div><div class="field"><label>Star rating<select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${b.rating===n?'selected':''}>${n===0?'Not rated':`${n} star${n===1?'':'s'}`}</option>`).join('')}</select></label></div><div class="field"><label>Personal notes<textarea name="notes" rows="3">${esc(b.notes)}</textarea></label></div><div class="modalfooter">${id?'<button type="button" class="danger" id="deleteBook">Remove</button>':'<button type="button" class="secondary" onclick="closeModal()">Cancel</button>'}<button type="submit">Save book</button></div></form>`;
 el('overlay').classList.add('show');
 el('bookForm').onsubmit=async e=>{
 e.preventDefault();if(busy)return;setBusy(true);
 let f=new FormData(e.target),obj={title:f.get('title').trim(),author:f.get('author').trim(),status:statusDb(f.get('status')),genre:f.get('genre'),rating:Number(f.get('rating')),notes:f.get('notes'),user_id:user.id};
 let result=id?await db.from('books').update(obj).eq('id',id).eq('user_id',user.id):await db.from('books').insert(obj);
 setBusy(false);
 if(result.error){alert('Book was not saved: '+result.error.message);return}
 closeModal();await loadBooks();
 };
 if(id)el('deleteBook').onclick=async()=>{if(!confirm('Remove this book?'))return;let {error}=await db.from('books').delete().eq('id',id).eq('user_id',user.id);if(error)alert('Could not remove book: '+error.message);else{closeModal();await loadBooks()}};
}
async function moveBook(id){
 let b=books.find(x=>x.id===id);if(!b)return;
 let {error}=await db.from('books').update({status:statusDb(b.status==='read'?'want':'read')}).eq('id',id).eq('user_id',user.id);
 if(error)alert('Change was not saved: '+error.message);else await loadBooks();
}
async function addAuthor(){
 if(authorError){alert('Author sync is not available: '+authorError);return}
 let name=prompt('Favorite author name');
 if(!name||!name.trim())return;
 name=name.trim();
 if(authors.some(a=>a.toLowerCase()===name.toLowerCase()))return;
 const {error}=await db.from('favorite_authors').insert({name,user_id:user.id});
 if(error){alert('Author was not saved: '+error.message);return}
 await loadAuthors();render();
}
async function deleteAuthor(name){
 if(authorError){alert('Author sync is not available: '+authorError);return}
 if(!authors.includes(name))return;
 if(!confirm('Remove '+name+' from your favorite authors? Your books will not be deleted.'))return;
 const {error}=await db.from('favorite_authors').delete().eq('user_id',user.id).eq('name',name);
 if(error){alert('Author was not deleted: '+error.message);return}
 await loadAuthors();render();
}
function searchAuthor(a){window.open('https://openlibrary.org/search?author='+encodeURIComponent(a.replace(/\bC\.?\s*J\.?\s*Box\b/i,'Box')),'_blank','noopener,noreferrer')}
function downloadBackup(){let blob=new Blob([JSON.stringify({books,authors},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='next-chapter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function signOut(){await db.auth.signOut();user=null;books=[];authors=[];loginScreen()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'&&!user)setTimeout(boot,0);if(event==='SIGNED_OUT'){user=null;books=[];authors=[];loginScreen()}});
boot();
</script></body></html>
