risham", "Lee Child", "Steven Fry", "Walter Isaacson", "Harlan Coplan ??", "Marcia Clark", "Michael Connelly"];const key='next-chapter-prototype-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}let books=Array.isArray(saved?.books)?saved.books:initialBooks;let authors=Array.isArray(saved?.authors)?saved.authors:initialAuthors;let tab='read',query='';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const genres=['','Mystery / Thriller','Historical Fiction','Nonfiction / History','Biography','Adventure','Other'];function persist(){localStorage.setItem(key,JSON.stringify({books,authors}))}function setTab(t){tab=t;query='';render()}function render(){el('readCount').textContent=books.filter(b=>b.status==='read').length;el('wantCount').textContent=books.filter(b=>b.status==='want').length;el('authorCount').textContent=authors.length;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let content=el('content');if(tab==='read'||tab==='want'){let matches=books.filter(b=>b.status===tab&&[b.title,b.author,b.genre].some(v=>v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>a.title.localeCompare(b.title));content.innerHTML=`<div class="heading"><h2>${tab==='read'?'Books Read':'To Read'}</h2><button onclick="editBook()">+ Add book</button></div><div class="toolbar"><input aria-label="Search books" placeholder="Search title, author or genre" value="${esc(query)}" oninput="query=this.value;renderList()"></div><div id="bookList"></div>`;renderList()}else if(tab==='authors'){content.innerHTML=`<div class="heading"><h2>Favorite Authors</h2><button onclick="addAuthor()">+ Add author</button></div>${authors.map(a=>`<div class="author"><div><b>${esc(a)}</b><div class="small">${books.filter(b=>b.author.toLowerCase()===a.toLowerCase()).length} books in library</div></div><button class="secondary" onclick
